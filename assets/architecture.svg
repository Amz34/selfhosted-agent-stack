<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="url(#bg)"/>
  <text x="480" y="46" fill="#f8fafc" font-size="26" font-weight="700" text-anchor="middle">Self-Hosted Agent Stack</text>
  <text x="480" y="74" fill="#94a3b8" font-size="15" text-anchor="middle">24/7 AI agent on free-tier ARM · 2 OCPU · 12 GB RAM · $0–5 per month</text>

  <rect x="60" y="104" width="840" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="126" fill="#cbd5e1" font-size="14" text-anchor="middle">REVERSE PROXY + TLS  ·  webhooks, static sites, health endpoints</text>

  <rect x="60" y="168" width="150" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="135" y="198" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Telegram</text>
  <text x="135" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">bot API · poll/webhook</text>

  <rect x="228" y="168" width="150" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="303" y="198" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">WhatsApp bridge</text>
  <text x="303" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">session + healthcheck</text>

  <rect x="396" y="168" width="150" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="471" y="198" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Email (IMAP/SMTP)</text>
  <text x="471" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">triage + replies</text>

  <rect x="564" y="168" width="150" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="639" y="198" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Webhooks / API</text>
  <text x="639" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">CRM, forms, alerts</text>

  <rect x="732" y="168" width="168" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="816" y="198" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Scheduled jobs</text>
  <text x="816" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">digests · monitors</text>

  <line x1="480" y1="138" x2="480" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M135,240 L135,262 L480,262 L480,284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M303,240 L303,262 L480,262" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M471,240 L471,284" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M639,240 L639,262 L480,262" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M816,240 L816,262 L480,262" fill="none" stroke="#64748b" stroke-width="2"/>

  <rect x="240" y="288" width="480" height="116" rx="12" fill="url(#core)" stroke="#60a5fa"/>
  <text x="480" y="322" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">AGENT GATEWAY  (persistent · systemd + linger)</text>
  <text x="480" y="348" fill="#dbeafe" font-size="13" text-anchor="middle">message loop · tool execution · per-agent memory isolation</text>
  <text x="480" y="370" fill="#dbeafe" font-size="13" text-anchor="middle">model routing · queued jobs · retry + backoff</text>
  <text x="480" y="392" fill="#bfdbfe" font-size="12" text-anchor="middle">one bot token per agent — never shared between processes</text>

  <line x1="480" y1="404" x2="480" y2="428" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="432" width="230" height="76" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="235" y="460" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">State</text>
  <text x="235" y="482" fill="#94a3b8" font-size="12" text-anchor="middle">SQLite / MySQL · file memory</text>
  <text x="235" y="500" fill="#94a3b8" font-size="12" text-anchor="middle">cold exports → object storage</text>

  <rect x="365" y="432" width="230" height="76" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="480" y="460" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Memory headroom</text>
  <text x="480" y="482" fill="#94a3b8" font-size="12" text-anchor="middle">zram zstd ≈ 5.8 GB compressed</text>
  <text x="480" y="500" fill="#94a3b8" font-size="12" text-anchor="middle">swap at priority 100, in RAM</text>

  <rect x="610" y="432" width="230" height="76" rx="10" fill="url(#safe)" stroke="#34d399"/>
  <text x="725" y="460" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Safety net</text>
  <text x="725" y="482" fill="#d1fae5" font-size="12" text-anchor="middle">resource watchdog · chrome reaper</text>
  <text x="725" y="500" fill="#d1fae5" font-size="12" text-anchor="middle">restart counter · restore drills</text>

  <rect x="60" y="536" width="840" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-dasharray="5 4"/>
  <text x="480" y="558" fill="#cbd5e1" font-size="13" text-anchor="middle">Principle: silent when healthy · loud when broken · every alert has a runbook</text>
  <text x="480" y="578" fill="#64748b" font-size="12" text-anchor="middle">Measured on one Always-Free ARM VM: browser leak reclaimed 3.0 GB → 1.9 GB RSS</text>
</svg>
